
services:
  postgres:
    image: postgres:18
    container_name: d14-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensor_db
    ports:
      - "5434:5432"
    volumes:
      - d14-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  api:
    image: sensor-api
    container_name: d14-api
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  adminer:
    image: adminer
    container_name: d14-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    restart: unless-stopped
volumes:
  d14-data:

