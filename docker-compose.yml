
services:
  postgres:
    image: postgres:18
    container_name: sensor-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensor_db
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  sensor-api:
    image: sensor-api
    container_name: sensor-api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pg-data:
